# deploy/contzo/app.conf: how deploy.sh ships this project to the WSL host.
# Sourced by bash, so it is shell syntax: no spaces around '=', quote values.
# Committed to git; never put secrets here (they belong in ~/apps/<APP_NAME>/shared/.env).

APP_NAME="__APP_NAME__"           # ~/apps/<APP_NAME>, unit name, Caddy site file name
SUBDOMAIN="__SUBDOMAIN__"         # -> https://__SUBDOMAIN__.contzo.lol
KIND="__KIND__"                   # service (process behind Caddy) | static (files served by Caddy)

# ---- service ---------------------------------------------------------------
PORT=__PORT__                     # free port from scripts/host-probe.sh; the app binds 127.0.0.1:$PORT
HEALTH_PATH="/"                   # answers 2xx/3xx when the app is up (a cheap route, ideally /health)
# One entry per long-running process: "name|command", run from the release dir.
# The first is the web process (unit <APP_NAME>); others become <APP_NAME>-<name>.
# PORT, HOST=127.0.0.1, NODE_ENV=production and shared/.env are in the environment.
PROCESSES=(
  "web|node server.js"
)
SSE=0                             # 1 if the app streams (server-sent events, long polls)
MAX_BODY=""                       # upload cap in Caddy, e.g. "60MiB". MB = 10^6 bytes, MiB = 2^20:
                                  # set it above the app's own limit (+ multipart overhead) or Caddy 413s first
SHARED_DIRS=()                    # e.g. ("uploads" "data"): persist across releases via shared/.
                                  # Never synced from the dev machine; the app must use them via
                                  # paths relative to its working dir (the release), e.g. data/app.db

# ---- static ----------------------------------------------------------------
# STATIC_DIR="dist"               # build output, relative to the project root
# SPA=1                           # 1: unknown paths serve /index.html (client-side routing)

# ---- optional ----------------------------------------------------------------
# DATABASE="postgres"             # --setup creates role + db, writes DB_* and DATABASE_URL to shared/.env
# BACKUP="postgres"               # or "sqlite:data/app.db" (path under shared/); nightly, newest 14 kept
# BASIC_AUTH_USER="me"            # password-protect the whole site in Caddy
# BASIC_AUTH_HASH='$2a$14$...'    # caddy hash-password --plaintext '<password>'  (single quotes!)
# SYNC_EXCLUDES=("/tmp/" "*.log") # project paths never copied to the host (leading / = repo root only)
# NODE_VERSION="24"
# KEEP_RELEASES=3

